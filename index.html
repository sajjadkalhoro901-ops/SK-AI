<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SK AI smart multilingual voice assistant"><title>SK AI — Smart Assistant</title><style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#05070b;--panel:#0b121d;--line:#1d2b3b;--text:#f7f9fc;--muted:#8795a8;--blue:#54c7ff;--violet:#8b5cff;--green:#68dc8c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#162b48 0,transparent 34%),radial-gradient(circle at 80% 35%,#24104b 0,transparent 28%),var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}.app{width:min(900px,94vw);margin:auto;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 12px}.logo{display:flex;align-items:center;gap:11px}.mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#65e9ff,#548cff,#a66cff);display:grid;place-items:center;color:#06101b;font:900 17px Orbitron;box-shadow:0 0 32px #58a6ff55}.brand{font:900 21px Orbitron,sans-serif;letter-spacing:2px}.brand .ai{background:linear-gradient(90deg,#5bd9ff,#9d65ff);-webkit-background-clip:text;background-clip:text;color:transparent}.tag{display:block;color:#718096;font-size:8px;letter-spacing:3.5px;margin-top:4px}.status{color:var(--green);font-size:12px}.main{text-align:center;padding:34px 0 70px}.main h1{font-size:clamp(38px,7vw,66px);margin:22px 0 8px;letter-spacing:-2.5px}.main>p{max-width:650px;margin:0 auto;color:var(--muted);line-height:1.65;font-size:15px}.voice-zone{margin:28px auto 18px}.orb-wrap{margin:auto;width:164px;height:164px;display:grid;place-items:center}.orb{width:126px;height:126px;border-radius:50%;position:relative;background:conic-gradient(from 0deg,#67e8f9,#4f8cff,#a05cff,#22d3ee,#67e8f9);animation:spin 2.8s linear infinite;box-shadow:0 0 45px #58a6ff55,0 0 90px #8b5cff22;border:0;cursor:pointer;padding:0}.orb:before{content:'';position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#294d70,#08101b 70%);box-shadow:inset 0 0 25px #000}.orb:after{content:'🎙';position:absolute;inset:0;display:grid;place-items:center;font-size:38px;text-shadow:0 0 20px #67e8f9}.orb.listening{animation:spin 1.2s linear infinite,pulse .75s ease-in-out infinite}.orb.speaking{animation:spin 1s linear infinite,pulse .65s ease-in-out infinite}.voice-label{font-size:12px;color:#91a0b3;margin-top:7px}.voice-controls{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:12px}.voice-pill{background:#0d1724;border:1px solid var(--line);color:#cbd7e5;border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer}.voice-pill.active{border-color:#67cfff;background:#11253a;color:#fff}.chat{display:flex;gap:8px;width:min(820px,100%);margin:28px auto 0;align-items:center}.chat input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:15px;color:#fff;padding:15px;outline:none;font-size:15px}.chat input:focus{border-color:#4b9bff;box-shadow:0 0 0 3px #4b9bff18}.btn{height:52px;border:0;border-radius:14px;padding:0 20px;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 24px #4b75ff22}.btn:disabled{opacity:.55;cursor:wait}.response{width:min(820px,100%);margin:12px auto 0;padding:17px;border:1px solid var(--line);border-radius:17px;background:#090f17;text-align:left;white-space:pre-wrap;line-height:1.7;min-height:55px}.tools{width:min(820px,100%);margin:9px auto;display:flex;justify-content:flex-end;gap:8px}.small{background:#111a26;border:1px solid var(--line);color:#d8e0ea;border-radius:11px;padding:9px 12px;cursor:pointer}.footer{text-align:center;color:#566273;font-size:11px;padding:18px 0 25px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.09);box-shadow:0 0 70px #58a6ff77,0 0 120px #8b5cff33}}@media(max-width:500px){.chat input{font-size:13px}.btn{padding:0 14px}.orb-wrap{width:132px;height:132px}.orb{width:106px;height:106px}.main{padding-top:25px}.main h1{font-size:42px}.main>p{font-size:13px}.brand{font-size:18px}}
</style></head><body><div class="app"><header class="top"><div class="logo"><div class="mark">SK</div><div><div class="brand"><span>SK</span> <span class="ai">AI</span></div><span class="tag">SMART ASSISTANT</span></div></div><span id="status" class="status">● Ready</span></header><main class="main"><h1>How can I help?</h1><p>SK AI — smart multilingual chat and natural voice assistant.</p><section class="voice-zone"><div class="orb-wrap"><button id="voice" class="orb" aria-label="Voice input"></button></div><div id="hint" class="voice-label">Tap the moving circle to speak</div><div class="voice-controls"><button class="voice-pill active" data-voice="female">♀ Girl voice</button><button class="voice-pill" data-voice="male">♂ Boy voice</button></div></section><div class="chat"><input id="input" type="text" placeholder="Ask SK AI anything…" autocomplete="off"><button id="send" class="btn">Send</button></div><div id="response" class="response">SK AI is ready.</div><div class="tools"><button id="speakBtn" class="small">🔊 Speak answer</button><button id="clearBtn" class="small">Clear chat</button></div></main><footer class="footer">SK AI • Smart Assistant • Created by Sajjad Kalhoro</footer></div><script>
const $=id=>document.getElementById(id);const input=$('input'),send=$('send'),response=$('response'),voice=$('voice'),hint=$('hint'),status=$('status'),speakBtn=$('speakBtn');let messages=[],lastAnswer='',audio=null,selectedVoice=localStorage.getItem('skVoice')||'female';
function setVoice(v){selectedVoice=v;localStorage.setItem('skVoice',v);document.querySelectorAll('.voice-pill').forEach(b=>b.classList.toggle('active',b.dataset.voice===v))}setVoice(selectedVoice);document.querySelectorAll('.voice-pill').forEach(b=>b.onclick=()=>setVoice(b.dataset.voice));
async function submit(){const q=input.value.trim();if(!q)return;input.value='';messages.push({role:'user',content:q});response.textContent='Thinking…';status.textContent='● Thinking';send.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.diagnostic?.message||d.error||`Request failed (${r.status})`);lastAnswer=String(d.reply||'No response.');response.textContent=lastAnswer;messages.push({role:'assistant',content:lastAnswer});status.textContent='● Ready';speak(lastAnswer)}catch(e){response.textContent=e.message||'SK AI unavailable.';status.textContent='● Error'}finally{send.disabled=false;input.focus()}}
send.onclick=submit;input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});$('clearBtn').onclick=()=>{messages=[];lastAnswer='';response.textContent='SK AI is ready.'};speakBtn.onclick=()=>speak(lastAnswer);
async function speak(text){if(!text)return;try{if(audio){audio.pause();audio=null}voice.classList.add('speaking');hint.textContent='Speaking…';status.textContent='● Speaking';const r=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,voice:selectedVoice})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Voice unavailable');const raw=atob(d.audio),pcm=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)pcm[i]=raw.charCodeAt(i);const wav=new ArrayBuffer(44+pcm.length),v=new DataView(wav),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+pcm.length,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,24000,true);v.setUint32(28,48000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,pcm.length,true);new Uint8Array(wav,44).set(pcm);audio=new Audio(URL.createObjectURL(new Blob([wav],{type:'audio/wav'})));audio.onended=()=>{voice.classList.remove('speaking');hint.textContent='Tap the moving circle to speak';status.textContent='● Ready'};await audio.play()}catch(e){voice.classList.remove('speaking');if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ur-PK';u.rate=.9;u.pitch=1;u.onend=()=>{hint.textContent='Tap the moving circle to speak';status.textContent='● Ready'};speechSynthesis.speak(u)}else{hint.textContent='Voice unavailable';status.textContent='● Ready'}}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='ur-PK';rec.interimResults=false;rec.continuous=false;rec.onstart=()=>{voice.classList.add('listening');hint.textContent='Listening…';status.textContent='● Listening'};rec.onend=()=>{voice.classList.remove('listening');if(status.textContent.includes('Listening')){hint.textContent='Tap the moving circle to speak';status.textContent='● Ready'}};rec.onerror=()=>{voice.classList.remove('listening');hint.textContent='Voice input unavailable';status.textContent='● Ready'};rec.onresult=e=>{input.value=e.results[0][0].transcript;submit()};voice.onclick=()=>{try{rec.start()}catch(e){}}}else voice.onclick=()=>hint.textContent='Speech recognition is not supported in this browser.';
</script></body></html>
